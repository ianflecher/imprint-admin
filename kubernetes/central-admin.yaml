apiVersion: v1
kind: Namespace
metadata:
  name: imprint-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-admin
  namespace: imprint-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: central-admin
  template:
    metadata:
      labels:
        app: central-admin
    spec:
      containers:
        - name: central-admin
          image: imprint/central-admin:test
          imagePullPolicy: Never
          ports:
            - containerPort: 10000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 10000
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 12
          env:
            - name: PORT
              value: "10000"
            - name: CENTRAL_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: central-admin-credentials
                  key: username
            - name: CENTRAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: central-admin-credentials
                  key: password
            - name: CENTRAL_ADMIN_HRIS_URL
              value: http://localhost:30080
            - name: CENTRAL_ADMIN_HRIS_HEALTH_URL
              value: http://hris:10000
            - name: CENTRAL_ADMIN_PRODUCTION_URL
              value: http://localhost:30081
            - name: CENTRAL_ADMIN_PRODUCTION_HEALTH_URL
              value: http://production:10000
            - name: CENTRAL_ADMIN_MARKETING_URL
              value: http://localhost:30082
            - name: CENTRAL_ADMIN_MARKETING_HEALTH_URL
              value: http://marketing:10000
---
apiVersion: v1
kind: Service
metadata:
  name: central-admin
  namespace: imprint-test
spec:
  type: NodePort
  selector:
    app: central-admin
  ports:
    - port: 10000
      targetPort: 10000
      nodePort: 30083
